<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Rozpočet stavby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap&subset=latin-ext,cyrillic" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--card:#161618;--card2:#1e1e21;--line:rgba(255,255,255,.09);--text:#f4f4f5;--muted:#8e8e93;--gold:#f5c518;--gold2:#d4a017}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(800px 500px at 100% -10%,rgba(245,197,24,.14),transparent 60%),linear-gradient(180deg,#0e0e10,#070708)}
.wrap{max-width:680px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 120px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{color:var(--gold);text-decoration:none;font-weight:600;white-space:nowrap}
.top h1{flex:1;text-align:center;font-size:17px;font-weight:700}
.lang{display:flex;background:#1e1e21;border:1px solid var(--line);border-radius:10px;padding:2px}
.lang button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:6px 9px;border-radius:8px;cursor:pointer}
.lang button.on{background:var(--gold);color:#111}
.tape{height:6px;border-radius:2px;background:repeating-linear-gradient(90deg,#1a1a1a 0 1px,transparent 1px 8px),linear-gradient(var(--gold),var(--gold2));opacity:.9}
.prog{height:4px;background:#222;border-radius:4px;margin:14px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));width:0;transition:width .3s}
.stepinfo{color:var(--muted);font-size:13px;margin-bottom:18px}
h2{font-size:28px;font-weight:800;letter-spacing:-.6px;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:20px;line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:999px;padding:9px 14px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}
.chip.on{background:var(--gold);color:#111;border-color:var(--gold);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border:0}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#39393d;border-radius:31px;transition:.2s;cursor:pointer}
.sw span::before{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:var(--gold)}
.sw input:checked+span::before{transform:translateX(20px)}
.nav{position:fixed;left:0;right:0;bottom:0;padding:12px 16px max(12px,env(safe-area-inset-bottom));background:rgba(11,11,12,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.nav .in{max-width:680px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.btn.pri{background:var(--gold);color:#111}
.btn.sec{background:#26262a;color:var(--text)}
.btn:disabled{opacity:.35}
.out{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.5;max-height:52vh;overflow:auto;background:#0f0f11}
.hint{font-size:13px;color:var(--muted);line-height:1.45;margin-top:8px}
.toast{position:fixed;left:50%;top:20px;transform:translateX(-50%) translateY(-80px);background:var(--gold);color:#111;font-weight:700;padding:10px 18px;border-radius:999px;transition:.3s;z-index:9}
.toast.show{transform:translateX(-50%) translateY(0)}
.step{display:none}.step.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:420px){.row{grid-template-columns:1fr}h2{font-size:24px}.top h1{font-size:15px}}
</style>
</head>
<body>
<div class="toast" id="toast" data-t="copied"></div>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html" data-t="back"></a>
    <h1 data-t="title"></h1>
    <div class="lang" id="lang"><button data-l="cs">CZ</button><button data-l="uk">UA</button></div>
  </div>
  <div class="tape"></div>
  <div class="prog"><i id="bar"></i></div>
  <div class="stepinfo" id="stepinfo"></div>

  <section class="step" data-s="1">
    <h2 data-t="s1h"></h2><p class="sub" data-t="s1p"></p>
    <div class="card"><h3 data-t="type"></h3><div class="chips" data-name="typ" data-single></div></div>
    <div class="card">
      <div class="field"><label data-t="name"></label><input type="text" id="nazev" data-ph="namePh"></div>
      <div class="field"><label data-t="desc"></label><textarea id="popis" data-ph="descPh"></textarea></div>
    </div>
  </section>

  <section class="step" data-s="2">
    <h2 data-t="s2h"></h2><p class="sub" data-t="s2p"></p>
    <div class="card"><h3 data-t="docs"></h3><div class="chips" data-name="podklady"></div></div>
    <div class="card">
      <div class="row">
        <div class="field"><label data-t="area"></label><input type="number" id="plocha" inputmode="decimal"></div>
        <div class="field"><label data-t="height"></label><input type="number" id="vyska" inputmode="decimal" step="0.01"></div>
      </div>
      <div class="field"><label data-t="dims"></label><textarea id="vymery" data-ph="dimsPh"></textarea></div>
    </div>
  </section>

  <section class="step" data-s="3">
    <h2 data-t="s3h"></h2><p class="sub" data-t="s3p"></p>
    <div id="prace"></div>
    <div class="card"><div class="field"><label data-t="moreWork"></label><textarea id="pracejine"></textarea></div></div>
  </section>

  <section class="step" data-s="4">
    <h2 data-t="s4h"></h2><p class="sub" data-t="s4p"></p>
    <div class="card">
      <div class="row">
        <div class="field"><label data-t="loc"></label><input type="text" id="lokalita" data-ph="locPh"></div>
        <div class="field"><label data-t="floor"></label><input type="text" id="patro" data-ph="floorPh"></div>
      </div>
      <div class="row">
        <div class="field"><label data-t="term"></label><input type="text" id="termin" data-ph="termPh"></div>
        <div class="field"><label data-t="std"></label><select id="standard"></select></div>
      </div>
    </div>
    <div class="card"><h3 data-t="cond"></h3>
      <div class="toggle"><span data-t="c_lift"></span><label class="sw"><input type="checkbox" id="vytah"><span></span></label></div>
      <div class="toggle"><span data-t="c_occ"></span><label class="sw"><input type="checkbox" id="obydleny"><span></span></label></div>
      <div class="toggle"><span data-t="c_park"></span><label class="sw"><input type="checkbox" id="parkovani"><span></span></label></div>
      <div class="toggle"><span data-t="c_zabor"></span><label class="sw"><input type="checkbox" id="zabor"><span></span></label></div>
      <div class="toggle"><span data-t="c_old"></span><label class="sw"><input type="checkbox" id="stary"><span></span></label></div>
    </div>
  </section>

  <section class="step" data-s="5">
    <h2 data-t="s5h"></h2><p class="sub" data-t="s5p"></p>
    <div class="card">
      <div class="row">
        <div class="field"><label data-t="rateW"></label><input type="number" class="firm" id="sazbaD"></div>
        <div class="field"><label data-t="rateC"></label><input type="number" class="firm" id="sazbaR"></div>
      </div>
      <div class="row">
        <div class="field"><label data-t="overhead"></label><input type="number" class="firm" id="rezie"></div>
        <div class="field"><label data-t="profit"></label><input type="number" class="firm" id="marze"></div>
      </div>
      <div class="row">
        <div class="field"><label data-t="matUp"></label><input type="number" class="firm" id="matPrir"></div>
        <div class="field"><label data-t="vat"></label><select class="firm" id="dph"></select></div>
      </div>
      <div class="field"><label data-t="subc"></label><textarea class="firm" id="subdod" data-ph="subcPh"></textarea></div>
      <div class="field"><label data-t="supp"></label><textarea class="firm" id="dodavatele" data-ph="suppPh"></textarea></div>
    </div>
  </section>

  <section class="step" data-s="6">
    <h2 data-t="s6h"></h2><p class="sub" data-t="s6p"></p>
    <div class="card"><h3 data-t="acc"></h3><div class="chips" data-name="presnost" data-single></div></div>
    <div class="card"><h3 data-t="form"></h3><div class="chips" data-name="forma" data-single></div></div>
    <div class="card"><h3 data-t="outLang"></h3><div class="chips" data-name="jazyk" data-single></div><p class="hint" data-t="outLangHint"></p></div>
    <div class="card"><div class="field"><label data-t="reserve"></label><input type="number" id="rezerva" value="5"></div></div>
  </section>

  <section class="step" data-s="7">
    <h2 data-t="s7h"></h2><p class="sub" data-t="s7p"></p>
    <div class="card out" id="out"></div>
    <p class="hint" data-t="tip"></p>
  </section>
</div>

<nav class="nav"><div class="in">
  <button class="btn sec" id="prev"></button>
  <button class="btn pri" id="next"></button>
</div></nav>

    ["Вікна, двері, конструкції",["Вікна","Двері","Дверні коробки","Підвіконня","Покрівельно-жерстяні елементи","Слюсарні елементи"]],
    ["Інженерні мережі",["Електромонтаж","Водопровід і каналізація","Опалення","Вентиляція","Газ","Слабкострумові мережі"]],
    ["Оболонка та дах",["Утеплення","Фасад","Покрівля","Кроквяна система","Ринви та водостоки"]],
    ["Інше",["Кухонний гарнітур","Сантехнічні прилади","Прибирання після робіт","Ревізії та випробування","Проєкт / статик","Інженерні послуги"]]
  ]
}};

let L = "cs";
try{ L = localStorage.getItem("yey-rozpocet-lang") || (navigator.language||"").startsWith("uk") && "uk" || "cs"; }catch(e){}

/* chipy se pamatují indexem, aby přepnutí jazyka nezrušilo výběr */
const sel = {typ:new Set(),podklady:new Set(),presnost:new Set([0]),forma:new Set([0]),jazyk:new Set([0]),prace:new Set()};

function chipsHTML(name,items,offset=0){
  return items.map((t,i)=>`<button class="chip${sel[name].has(offset+i)?" on":""}" data-i="${offset+i}">${t}</button>`).join("");
}
function renderLang(){
  const t=T[L];
  document.documentElement.lang=L; document.title=t.title;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t[el.dataset.t]);
  document.querySelectorAll("[data-ph]").forEach(el=>el.placeholder=t[el.dataset.ph]);
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
  ["typ","podklady","presnost","forma","jazyk"].forEach(n=>document.querySelector(`.chips[data-name="${n}"]`).innerHTML=chipsHTML(n,t[n]));
  let off=0;
  document.getElementById("prace").innerHTML=t.prace.map(([g,items])=>{
    const h=`<div class="card"><h3>${g}</h3><div class="chips" data-name="prace">${chipsHTML("prace",items,off)}</div></div>`;
    off+=items.length; return h;
  }).join("");
  ["standard","dph"].forEach(id=>{
    const s=document.getElementById(id), i=Math.max(0,s.selectedIndex);
    s.innerHTML=t[id].map(o=>`<option>${o}</option>`).join(""); s.selectedIndex=i;
  });
  loadFirm(); show(false);
}
document.getElementById("lang").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  L=b.dataset.l; try{localStorage.setItem("yey-rozpocet-lang",L)}catch(e){}
  renderLang();
});
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c)return;
  const g=c.parentElement, n=g.dataset.name, i=+c.dataset.i;
  if(g.hasAttribute("data-single")){sel[n].clear();sel[n].add(i);g.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");}
  else{sel[n].has(i)?sel[n].delete(i):sel[n].add(i);c.classList.toggle("on");}
});

/* firemní parametry v prohlížeči (DPH ukládána indexem kvůli jazyku) */
const KEY="yey-rozpocet-firma";
function loadFirm(){try{const s=JSON.parse(localStorage.getItem(KEY)||"{}");document.querySelectorAll(".firm").forEach(el=>{
  if(s[el.id]==null)return; if(el.tagName==="SELECT"){el.selectedIndex=+s[el.id]||0}else el.value=s[el.id]})}catch(e){}}
document.querySelectorAll(".firm").forEach(el=>el.addEventListener(el.tagName==="SELECT"?"change":"input",()=>{
  try{const s={};document.querySelectorAll(".firm").forEach(x=>s[x.id]=x.tagName==="SELECT"?x.selectedIndex:x.value);localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}
}));

const steps=[...document.querySelectorAll(".step")]; let cur=0;
const $=id=>document.getElementById(id).value.trim();
const chk=id=>document.getElementById(id).checked;
const pick=n=>{const flat=n==="prace"?T[L].prace.flatMap(g=>g[1]):T[L][n];return [...sel[n]].sort((a,b)=>a-b).map(i=>flat[i]).filter(Boolean)};

function show(scroll=true){
  const t=T[L];
  steps.forEach((s,i)=>s.classList.toggle("on",i===cur));
  document.getElementById("bar").style.width=((cur+1)/steps.length*100)+"%";
  document.getElementById("stepinfo").textContent=`${t.step} ${cur+1} ${t.of} ${steps.length} · ${t.titles[cur]}`;
  const p=document.getElementById("prev"); p.disabled=cur===0; p.textContent=t.prev;
  const last=cur===steps.length-1;
  document.getElementById("next").textContent=last?t.copy:(cur===steps.length-2?t.make:t.next);
  if(last) document.getElementById("out").textContent=build();
  if(scroll) scrollTo({top:0,behavior:"smooth"});
}
document.getElementById("prev").onclick=()=>{if(cur>0){cur--;show()}};
document.getElementById("next").onclick=()=>{
  if(cur<steps.length-1){cur++;show();return}
  const txt=document.getElementById("out").textContent;
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(toast).catch(()=>{
    const r=document.createRange();r.selectNodeContents(document.getElementById("out"));
    const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand("copy");toast();
  });
};
function toast(){const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600)}

function line(label,val){return val?`- ${label}: ${val}\n`:""}
const selText=id=>{const s=document.getElementById(id);return s.options[s.selectedIndex]?.text||""};

const outIdx=()=>[...sel.jazyk][0]??0;
function outLangCS(){return outIdx()===1?" Samotný rozpočet (tabulku, názvy položek, rekapitulaci) napiš v ukrajinštině; vysvětlivky a otázky na mě piš česky.":""}
function outLangUK(){return outIdx()===0
  ?" Сам кошторис (таблицю, назви позицій, підсумок) склади ЧЕСЬКОЮ мовою — він призначений для чеського замовника. Пояснення та питання до мене пиши українською."
  :" Відповідай українською мовою."}
function build(){ return L==="uk" ? buildUK() : buildCS(); }

function buildCS(){
  const okol=[chk("vytah")?"výtah je k dispozici":"bez výtahu (počítat s ručním vynášením/snášením)",
    chk("obydleny")&&"objekt je obydlený (ochrana, etapizace, úklid)",chk("parkovani")&&"komplikované parkování a zásobování",
    chk("zabor")&&"nutný zábor veřejného prostranství",chk("stary")&&"starý objekt – riziko skrytých vad"].filter(Boolean);
  const pi=[...sel.presnost][0]??0, fi=[...sel.forma][0]??0;
  const vystup=["Výsledek zobraz jako přehlednou tabulku přímo v chatu.",
    "Výsledek vytvoř jako soubor Excel (.xlsx) s funkčními vzorci (množství × jednotková cena, mezisoučty oddílů, rekapitulace).",
    "Nejdřív sestav interní položkový rozpočet, pak z něj připrav srozumitelnou cenovou nabídku pro zákazníka (oddíly se součty, bez interní režie a marže jako samostatných řádků)."][fi];
  return `Jsi zkušený rozpočtář stavební firmy v ČR. Připrav ${T.cs.presnost[pi].toLowerCase()} pro níže popsanou zakázku. Ceny uváděj v Kč, v cenové úrovni roku ${new Date().getFullYear()} a pro lokalitu zakázky.${outLangCS()}

## ZAKÁZKA
${line("Typ",pick("typ").join(", "))}${line("Název",$("nazev"))}${line("Popis od investora",$("popis"))}${line("Standard provedení",selText("standard"))}
## PODKLADY
${line("K dispozici",pick("podklady").join(", ")||"jen slovní popis")}${line("Podlahová plocha",$("plocha")&&$("plocha")+" m²")}${line("Světlá výška",$("vyska")&&$("vyska")+" m")}${line("Známé rozměry a výměry",$("vymery"))}Přiložené podklady pečlivě projdi a výměry odvozuj z nich.

## ROZSAH PRACÍ
${pick("prace").map(p=>"- "+p).join("\n")||"- (neupřesněno – navrhni podle popisu)"}
${$("pracejine")?"- Další: "+$("pracejine")+"\n":""}
## PODMÍNKY STAVBY
${line("Lokalita",$("lokalita"))}${line("Podlaží",$("patro"))}${line("Termín",$("termin"))}${okol.map(o=>"- "+o).join("\n")}

## PARAMETRY FIRMY
${line("Hodinová sazba dělník",$("sazbaD")&&$("sazbaD")+" Kč/h")}${line("Hodinová sazba řemeslník",$("sazbaR")&&$("sazbaR")+" Kč/h")}${line("Režie",$("rezie")&&$("rezie")+" %")}${line("Zisk",$("marze")&&$("marze")+" %")}${line("Přirážka na materiál",$("matPrir")&&$("matPrir")+" %")}${line("DPH",selText("dph"))}${line("Vlastní práce / subdodávky",$("subdod"))}${line("Dodavatelé a známé ceny",$("dodavatele"))}${line("Rezerva na nepředvídané práce",$("rezerva")&&$("rezerva")+" %")}
## POŽADAVKY NA ROZPOČET
1. Členění podle oddílů stavebního rozpočtu (HSV / PSV / M / VRN), u každé položky: číslo, popis, MJ, množství, jednotková cena materiál, jednotková cena práce, cena celkem.
2. U KAŽDÉ položky označ původ množství: [Z] změřeno z podkladů, [O] odhad. U odhadů napiš krátce, z čeho vychází.
3. Nezapomeň na vedlejší a často opomíjené náklady: zařízení staveniště, přesun hmot, vynášení a odvoz suti, poplatky za skládku, lešení, ochranu konstrukcí, úklid, revize, dopravu, ztratné materiálu.
4. Pokud z rozsahu prací něco logicky chybí (např. bourání bez odvozu suti, obklad bez hydroizolace), upozorni na to a navrhni doplnění jako samostatné položky.
5. Ceny nevymýšlej s falešnou jistotou — kde si nejsi jistý, uveď rozpětí a vysvětli.
6. Na konci: rekapitulace (materiál, práce, VRN, režie, zisk, rezerva, celkem bez DPH, DPH, celkem s DPH) a seznam „Co chybí v podkladech / co ověřit“ — otázky, které mám položit investorovi nebo dodavatelům.
7. ${vystup}

Než začneš počítat, pokud ti v podkladech chybí něco zásadního, nejdřív se mě zeptej (max. 5 otázek).`;
}

function buildUK(){
  const okol=[chk("vytah")?"є ліфт":"без ліфта (врахувати ручне занесення/винесення)",
    chk("obydleny")&&"у приміщенні живуть люди (захист, поетапність, прибирання)",chk("parkovani")&&"складне паркування та доставка",
    chk("zabor")&&"потрібне зайняття громадського простору",chk("stary")&&"старий будинок – ризик прихованих дефектів"].filter(Boolean);
  const pi=[...sel.presnost][0]??0, fi=[...sel.forma][0]??0;
  const vystup=["Результат покажи як наочну таблицю прямо в чаті.",
    "Результат створи як файл Excel (.xlsx) з робочими формулами (кількість × ціна за одиницю, проміжні суми розділів, підсумок).",
    "Спочатку склади внутрішній детальний кошторис, потім на його основі підготуй зрозумілу цінову пропозицію для клієнта (розділи з сумами, без окремих рядків внутрішніх накладних витрат і маржі)."][fi];
  return `Ти досвідчений кошторисник будівельної фірми в Чехії. Підготуй: ${T.uk.presnost[pi].toLowerCase()} для описаного нижче замовлення. Ціни вказуй у чеських кронах (Kč), на рівні цін ${new Date().getFullYear()} року та для місця виконання робіт.${outLangUK()}

## ЗАМОВЛЕННЯ
${line("Тип",pick("typ").join(", "))}${line("Назва",$("nazev"))}${line("Опис від замовника",$("popis"))}${line("Стандарт виконання",selText("standard"))}
## ДОКУМЕНТИ
${line("Є в наявності",pick("podklady").join(", ")||"лише усний опис")}${line("Площа підлоги",$("plocha")&&$("plocha")+" м²")}${line("Висота приміщення",$("vyska")&&$("vyska")+" м")}${line("Відомі розміри та обсяги",$("vymery"))}Уважно переглянь додані документи та визначай обсяги на їх основі.

## ОБСЯГ РОБІТ
${pick("prace").map(p=>"- "+p).join("\n")||"- (не уточнено – запропонуй на основі опису)"}
${$("pracejine")?"- Інше: "+$("pracejine")+"\n":""}
## УМОВИ БУДІВНИЦТВА
${line("Місце",$("lokalita"))}${line("Поверх",$("patro"))}${line("Термін",$("termin"))}${okol.map(o=>"- "+o).join("\n")}

## ПАРАМЕТРИ ФІРМИ
${line("Погодинна ставка робітника",$("sazbaD")&&$("sazbaD")+" Kč/год")}${line("Погодинна ставка майстра",$("sazbaR")&&$("sazbaR")+" Kč/год")}${line("Накладні витрати",$("rezie")&&$("rezie")+" %")}${line("Прибуток",$("marze")&&$("marze")+" %")}${line("Націнка на матеріал",$("matPrir")&&$("matPrir")+" %")}${line("ПДВ (DPH)",selText("dph"))}${line("Власні роботи / субпідряд",$("subdod"))}${line("Постачальники та відомі ціни",$("dodavatele"))}${line("Резерв на непередбачені роботи",$("rezerva")&&$("rezerva")+" %")}
## ВИМОГИ ДО КОШТОРИСУ
1. Поділ на розділи за чеською практикою (HSV – основні будівельні роботи / PSV – спеціальні та оздоблювальні роботи / M – монтажні роботи / VRN – додаткові витрати будівництва), для кожної позиції: номер, опис, од. вим., кількість, ціна за одиницю матеріал, ціна за одиницю робота, разом.
2. Для КОЖНОЇ позиції познач походження кількості: [З] заміряно з документів, [О] оцінка. Для оцінок коротко напиши, на чому вони базуються.
3. Не забудь про додаткові витрати, які часто пропускають: облаштування будмайданчика, переміщення матеріалів, винесення і вивезення будсміття, плата за полігон, риштування, захист конструкцій, прибирання, ревізії, транспорт, втрати матеріалу.
4. Якщо в обсязі робіт чогось логічно бракує (напр. демонтаж без вивезення сміття, плитка без гідроізоляції), попередь про це і запропонуй доповнення окремими позиціями.
5. Не вигадуй ціни з фальшивою впевненістю — де не впевнений, вкажи діапазон і поясни.
6. В кінці: підсумок (матеріал, робота, VRN, накладні, прибуток, резерв, разом без ПДВ, ПДВ, разом з ПДВ) і список «Чого бракує в документах / що перевірити» — питання, які я маю поставити замовнику або постачальникам.
7. ${vystup}

Перш ніж почнеш рахувати, якщо в документах бракує чогось суттєвого, спочатку запитай мене (макс. 5 питань).`;
}
