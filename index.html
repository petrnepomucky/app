<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>YeY Aplikace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c; --bg2:#151517; --glass:rgba(255,255,255,.06); --line:rgba(255,255,255,.09);
  --text:#f4f4f5; --muted:#8e8e93; --gold:#f5c518; --gold2:#d4a017; --gold3:#a87b00;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden;
  background-image:
    radial-gradient(900px 600px at 85% -10%, rgba(245,197,24,.18), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(212,160,23,.12), transparent 60%),
    linear-gradient(180deg,#0e0e10,#070708);
}
.wrap{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 140px}
.status{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;padding:4px 10px 0}
.status .r{display:flex;gap:6px;align-items:center;opacity:.9}
.batt{width:24px;height:11px;border:1.5px solid #fff;border-radius:3px;position:relative;opacity:.9}
.batt::after{content:"";position:absolute;inset:1.5px;right:5px;background:var(--gold);border-radius:1px}
.head{text-align:center;margin:34px 0 8px}
.clock{font-size:76px;font-weight:700;letter-spacing:-3px;line-height:1;
  background:linear-gradient(180deg,#fff 0%,#d9d9de 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.date{color:var(--muted);font-weight:500;margin-top:6px;text-transform:capitalize}
.brand{display:flex;justify-content:center;align-items:center;gap:10px;margin:26px 0 6px}
.brand b{font-weight:800;font-size:22px;color:var(--gold);letter-spacing:.5px}
.brand span{color:var(--muted);font-size:14px}
.tape{height:10px;margin:0 auto 28px;max-width:220px;border-radius:2px;
  background:repeating-linear-gradient(90deg,#1a1a1a 0 1px,transparent 1px 8px),linear-gradient(var(--gold),var(--gold2));
  box-shadow:0 0 18px rgba(245,197,24,.25)}
.search{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:14px;padding:10px 14px;margin-bottom:22px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px}
.search svg{flex:none;opacity:.6}
.section{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;margin:6px 6px 12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px;margin-bottom:30px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--text)}
.icon{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;position:relative;overflow:hidden;
  transition:transform .15s ease;box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18)}
.icon::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.16),transparent 55%)}
.icon svg{width:32px;height:32px;position:relative}
.app:active .icon{transform:scale(.9)}
.app:hover .icon{transform:translateY(-2px)}
.label{font-size:12px;font-weight:500;text-align:center;line-height:1.2;max-width:76px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{position:absolute;top:-4px;right:-4px;z-index:2;background:#ff3b30;color:#fff;font-size:10px;font-weight:700;
  border-radius:10px;padding:2px 6px;border:2px solid var(--bg)}
.ico-wrap{position:relative}
.t-gold{background:linear-gradient(145deg,#ffd84d,#d4a017 60%,#a87b00)}
.t-gold svg{color:#111}
.t-dark{background:linear-gradient(145deg,#2c2c30,#141416)}
.t-dark svg{color:var(--gold)}
.t-grey{background:linear-gradient(145deg,#5a5a60,#2e2e33)}
.t-grey svg{color:#fff}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));
  width:min(528px,calc(100% - 32px));display:flex;justify-content:space-around;padding:12px 10px;border-radius:30px;
  background:rgba(40,40,44,.55);border:1px solid var(--line);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%)}
.dock .label{display:none}
.empty{color:var(--muted);text-align:center;padding:20px;display:none}
footer{text-align:center;color:#5c5c62;font-size:12px;margin-top:10px}
@media (max-width:380px){.icon{width:56px;height:56px;border-radius:14px}.icon svg{width:28px;height:28px}.clock{font-size:64px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="status"><span id="st">9:41</span><span class="r">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="#fff"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
    <span class="batt"></span></span></div>

  <div class="head">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
  </div>

  <div class="brand"><b>YeY</b><span>aplikace</span></div>
  <div class="tape"></div>

  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Hledat aplikaci" autocomplete="off">
  </label>

  <div id="sections"></div>
  <div class="empty" id="empty">Nic nenalezeno</div>
  <footer>app.yey.cz</footer>
</div>

<nav class="dock" id="dock"></nav>

<script>
/* ===== SEZNAM APLIKACÍ — nové stačí přidat sem =====
   tone: gold | dark | grey ; dock: true = i v doku dole ; badge: "NOVÉ" apod. */
const APPS = [
  {name:"Rozpočet stavby", url:"rozpocet.html", group:"Stavba", tone:"gold", icon:"calc", dock:true, badge:"NOVÉ"},
  {name:"Audit faktur",    url:"audit.html",  group:"Kancelář", tone:"dark", icon:"invoice", dock:true},
  {name:"Pixel Trezor",    url:"stego.html",    group:"Nástroje", tone:"dark", icon:"lock", dock:true},
];

const ICONS = {
  calc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V10l7-5 7 5v11"/><path d="M9 21v-6h6v6"/><path d="M12 5V2"/></svg>',
  invoice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/><path d="M9 13h7M9 17h5"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  scan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 10h8M8 14h5"/></svg>',
  sign:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3-1 4-6 6-6s1 5 3 5 2-3 4-3 2 2 5 2"/><path d="M3 21h18"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.5"/></svg>',
  game:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h6a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h10"/><circle cx="19" cy="6" r="1.5" fill="currentColor"/></svg>',
  app:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>'
};

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tile = (a,withBadge=true) => `
  <a class="app" href="${esc(a.url)}" title="${esc(a.name)}">
    <div class="ico-wrap">
      <div class="icon t-${a.tone||'dark'}">${ICONS[a.icon]||ICONS.app}</div>
      ${withBadge&&a.badge?`<span class="badge">${esc(a.badge)}</span>`:""}
    </div>
    <span class="label">${esc(a.name)}</span>
  </a>`;

function render(q=""){
  q=q.trim().toLowerCase();
  const list=APPS.filter(a=>!q||a.name.toLowerCase().includes(q)||(a.group||"").toLowerCase().includes(q));
  const groups=[...new Set(list.map(a=>a.group||"Ostatní"))];
  document.getElementById("sections").innerHTML=groups.map(g=>`
    <div class="section">${esc(g)}</div>
    <div class="grid">${list.filter(a=>(a.group||"Ostatní")===g).map(a=>tile(a)).join("")}</div>`).join("");
  document.getElementById("empty").style.display=list.length?"none":"block";
}
document.getElementById("dock").innerHTML=APPS.filter(a=>a.dock).slice(0,4).map(a=>tile(a,false)).join("");
document.getElementById("q").addEventListener("input",e=>render(e.target.value));
render();

function tick(){
  const d=new Date(), t=d.toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"});
  document.getElementById("clock").textContent=t;
  document.getElementById("st").textContent=t;
  document.getElementById("date").textContent=d.toLocaleDateString("cs-CZ",{weekday:"long",day:"numeric",month:"long"});
}
tick(); setInterval(tick,10000);
</script>
</body>
</html>
